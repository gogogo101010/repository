{% extends "base.html" %}
{% block title %}Login - servers.com{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Login</h1>

    <form method="POST" class="bg-white border border-gray-200 rounded-lg p-6 space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" id="email" required
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="password" required
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
        </div>
        <button type="submit" class="w-full bg-gray-900 text-white py-2 rounded text-sm font-medium hover:bg-gray-700">Login</button>
        <p class="text-sm text-gray-500 text-center">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-gray-900 underline">Sign up</a></p>
    </form>
</div>
{% endblock %}
