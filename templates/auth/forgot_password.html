{% extends "base.html" %}
{% block title %}Forgot Password - servers.com{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Forgot Password</h1>

    <form method="POST" class="bg-white border border-gray-200 rounded-lg p-6 space-y-4">
        <p class="text-sm text-gray-600">Enter your email address and we'll send you a link to reset your password.</p>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" id="email" required
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
        </div>
        <button type="submit" class="w-full bg-gray-900 text-white py-2 rounded text-sm font-medium hover:bg-gray-700">Send Reset Link</button>
        <p class="text-sm text-gray-500 text-center"><a href="{{ url_for('auth.login') }}" class="text-gray-900 underline">Back to login</a></p>
    </form>
</div>
{% endblock %}
