{% extends "base.html" %}
{% block title %}New Ticket - servers.com{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <a href="{{ url_for('customer.tickets') }}" class="text-sm text-gray-500 hover:text-gray-700 mb-2 block">&larr; Back to Tickets</a>
    <h1 class="text-2xl font-bold text-gray-900 mb-6">New Support Ticket</h1>

    <form method="POST" class="bg-white border border-gray-200 rounded-lg p-6 space-y-4">
        <div>
            <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
            <input type="text" name="subject" id="subject" required
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
        </div>
        <div>
            <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
            <select name="priority" id="priority" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
        </div>
        <div>
            <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
            <textarea name="message" id="message" rows="6" required
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500"></textarea>
        </div>
        <button type="submit" class="bg-gray-900 text-white px-6 py-2 rounded text-sm font-medium hover:bg-gray-700">Submit Ticket</button>
    </form>
</div>
{% endblock %}
