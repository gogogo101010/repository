{% extends "base.html" %}
{% block title %}Order Server - servers.com{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Order a Server</h1>

    <form method="POST" class="space-y-6">
        <!-- Plan Selection -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-3">Select Plan</label>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                {% for plan_id, plan in plans.items() %}
                <label class="cursor-pointer">
                    <input type="radio" name="plan" value="{{ plan_id }}" class="peer hidden" {% if loop.first %}checked{% endif %}>
                    <div class="border border-gray-200 rounded-lg p-4 peer-checked:border-gray-900 peer-checked:bg-gray-50">
                        <h3 class="font-semibold text-gray-900 mb-1">{{ plan.name }}</h3>
                        <p class="text-xl font-bold text-gray-900 mb-2">${{ "%.2f"|format(plan.price) }}<span class="text-xs text-gray-500 font-normal">/mo</span></p>
                        <ul class="text-xs text-gray-600 space-y-1">
                            <li>{{ plan.cores }} vCPU</li>
                            <li>{{ (plan.ram / 1024)|int }} GB RAM</li>
                            <li>{{ plan.disk }} GB SSD</li>
                            <li>{{ (plan.bandwidth / 1000)|int }} TB BW</li>
                        </ul>
                    </div>
                </label>
                {% endfor %}
            </div>
        </div>

        <!-- Hostname -->
        <div>
            <label for="hostname" class="block text-sm font-medium text-gray-700 mb-1">Hostname</label>
            <input type="text" name="hostname" id="hostname" required placeholder="my-server"
                class="w-full max-w-md border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
        </div>

        <!-- ISO Selection -->
        <div>
            <label for="iso" class="block text-sm font-medium text-gray-700 mb-1">Operating System</label>
            <select name="iso" id="iso" class="w-full max-w-md border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
                {% for iso in isos %}
                <option value="{{ iso.id }}">{{ iso.name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="bg-gray-900 text-white px-6 py-2 rounded text-sm font-medium hover:bg-gray-700">
            Proceed to Payment
        </button>
    </form>
</div>
{% endblock %}
